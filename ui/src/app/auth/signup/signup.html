<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">We'll verify your mobile number with an OTP next</p>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <div class="auth-field">
      <label for="signup-name">Full name</label>
      <input id="signup-name" type="text" [(ngModel)]="name" placeholder="Jane Doe" autocomplete="name" />
    </div>

    <div class="auth-field">
      <label for="signup-mobile">Mobile number</label>
      <input
        id="signup-mobile"
        type="text"
        [(ngModel)]="mobile_number"
        placeholder="+91XXXXXXXXXX"
        autocomplete="tel"
      />
    </div>

    <div class="auth-field">
      <label for="signup-email">Email address</label>
      <input
        id="signup-email"
        type="email"
        [(ngModel)]="email"
        placeholder="you@example.com"
        autocomplete="email"
        (keyup.enter)="submit()"
      />
    </div>

    <button class="auth-btn auth-btn-primary" [disabled]="!valid || loading" (click)="submit()">
      {{ loading ? 'Sending code…' : 'Continue' }}
    </button>

    <div class="auth-links">
      <a routerLink="/login">Already have an account? Log in</a>
    </div>
  </div>
</div>
