<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{ purposeLabel }}</h1>
    <p class="auth-subtitle">Enter the 6-digit code sent to {{ mobile }}</p>

    @if (devOtpHint) {
      <div class="auth-hint">
        Dev mode — no SMS gateway configured. Your code is <strong>{{ devOtpHint }}</strong
        >.
      </div>
    }

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <div class="auth-field auth-pin-input">
      <label for="otp-code">Verification code</label>
      <input
        id="otp-code"
        type="text"
        [(ngModel)]="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="••••••"
        (keyup.enter)="submit()"
      />
    </div>

    <button class="auth-btn auth-btn-primary" [disabled]="loading" (click)="submit()">
      {{ loading ? 'Verifying…' : 'Verify' }}
    </button>

    <div class="auth-links">
      @if (resendCooldown === 0) {
        <button type="button" (click)="resend()">{{ resendLoading ? 'Sending…' : 'Resend code' }}</button>
      }
      @if (resendCooldown > 0) {
        <span>Resend available in {{ resendCooldown }}s</span>
      }
    </div>
  </div>
</div>
