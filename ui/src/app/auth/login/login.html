<div class="auth-page">
  @if (!forgotMode) {
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in with your PIN or Google account</p>
      @if (error) {
        <div class="auth-error">{{ error }}</div>
      }
      <div class="auth-field">
        <label for="login-identifier">Mobile number or email</label>
        <input
          id="login-identifier"
          type="text"
          [(ngModel)]="identifier"
          placeholder="+91XXXXXXXXXX or you@example.com"
          autocomplete="username"
        />
      </div>
      <div class="auth-field auth-pin-input">
        <label for="login-pin">4-digit PIN</label>
        <input
          id="login-pin"
          type="password"
          [(ngModel)]="pin"
          maxlength="4"
          inputmode="numeric"
          placeholder="••••"
          autocomplete="current-password"
          (keyup.enter)="submit()"
        />
      </div>
      <button class="auth-btn auth-btn-primary" [disabled]="loading" (click)="submit()">
        {{ loading ? 'Logging in…' : 'Log in with PIN' }}
      </button>
      <div class="auth-divider">OR</div>
      <button class="auth-btn auth-btn-google" (click)="continueWithGoogle()">
        Continue with Google
      </button>
      <div class="auth-links">
        <button type="button" (click)="toggleForgot()">Forgot PIN?</button>
        <a routerLink="/signup">New here? Create an account</a>
      </div>
    </div>
  }

  @if (forgotMode) {
    <div class="auth-card">
      <h1 class="auth-title">Reset your PIN</h1>
      <p class="auth-subtitle">We'll send a verification code to your mobile number</p>
      @if (forgotError) {
        <div class="auth-error">{{ forgotError }}</div>
      }
      <div class="auth-field">
        <label for="forgot-mobile">Mobile number</label>
        <input
          id="forgot-mobile"
          type="text"
          [(ngModel)]="forgotMobile"
          placeholder="+91XXXXXXXXXX"
          (keyup.enter)="sendResetOtp()"
        />
      </div>
      <button class="auth-btn auth-btn-primary" [disabled]="forgotLoading" (click)="sendResetOtp()">
        {{ forgotLoading ? 'Sending…' : 'Send code' }}
      </button>
      <div class="auth-links">
        <button type="button" (click)="toggleForgot()">Back to login</button>
      </div>
    </div>
  }
</div>
