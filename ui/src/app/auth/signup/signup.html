<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">We'll verify your mobile number with an OTP next</p>

    <div class="auth-error" *ngIf="error">{{ error }}</div>

    <label class="auth-field">
      <label>Full name</label>
      <input type="text" [(ngModel)]="name" placeholder="Jane Doe" autocomplete="name" />
    </label>

    <label class="auth-field">
      <label>Mobile number</label>
      <input type="text" [(ngModel)]="mobile_number" placeholder="+91XXXXXXXXXX" autocomplete="tel" />
    </label>

    <label class="auth-field">
      <label>Email address</label>
      <input type="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" (keyup.enter)="submit()" />
    </label>

    <button class="auth-btn auth-btn-primary" [disabled]="!valid || loading" (click)="submit()">
      {{ loading ? 'Sending code…' : 'Continue' }}
    </button>

    <div class="auth-links">
      <a routerLink="/login">Already have an account? Log in</a>
    </div>
  </div>
</div>
