<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{ isReset ? 'Set a new PIN' : 'Create your PIN' }}</h1>
    <p class="auth-subtitle">You'll use this 4-digit PIN to log in from now on</p>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <div class="auth-field auth-pin-input">
      <label for="pin-new">New PIN</label>
      <input
        id="pin-new"
        type="password"
        [(ngModel)]="pin"
        maxlength="4"
        inputmode="numeric"
        placeholder="••••"
      />
    </div>

    <div class="auth-field auth-pin-input">
      <label for="pin-confirm">Confirm PIN</label>
      <input
        id="pin-confirm"
        type="password"
        [(ngModel)]="confirmPin"
        maxlength="4"
        inputmode="numeric"
        placeholder="••••"
        (keyup.enter)="submit()"
      />
    </div>

    <button class="auth-btn auth-btn-primary" [disabled]="!valid || loading" (click)="submit()">
      {{ loading ? 'Saving…' : 'Save PIN & continue' }}
    </button>
  </div>
</div>
