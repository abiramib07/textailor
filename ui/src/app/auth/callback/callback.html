<div class="auth-page">
  <div class="auth-card">
    @if (loading) {
      <h1 class="auth-title">Signing you in…</h1>
      <p class="auth-subtitle">Hang tight, this only takes a second.</p>
    }

    @if (!loading && error) {
      <h1 class="auth-title">Something went wrong</h1>
      <div class="auth-error">{{ error }}</div>
      <div class="auth-links">
        <a routerLink="/login">Back to login</a>
      </div>
    }
  </div>
</div>
