<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">One more thing</h1>
    <p class="auth-subtitle">Add your mobile number to finish setting up your account</p>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <div class="auth-field">
      <label for="complete-mobile">Mobile number</label>
      <input
        id="complete-mobile"
        type="text"
        [(ngModel)]="mobile_number"
        placeholder="+91XXXXXXXXXX"
        (keyup.enter)="submit()"
      />
    </div>

    <button
      class="auth-btn auth-btn-primary"
      [disabled]="!mobile_number.trim() || loading"
      (click)="submit()"
    >
      {{ loading ? 'Sending code…' : 'Send verification code' }}
    </button>

    <div class="auth-links">
      <button type="button" (click)="skip()">Skip for now</button>
    </div>
  </div>
</div>
